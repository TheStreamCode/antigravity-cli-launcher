name: Feature request
description: Propose a focused improvement to the launcher
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem or limitation, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain whether the proposal executes commands, downloads content, changes configuration, or collects data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: This request is specific to the Antigravity launcher rather than the multi-agent Super CLI extension.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
